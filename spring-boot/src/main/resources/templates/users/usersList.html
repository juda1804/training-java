<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Booking service</title>
    <link href="http://netdna.bootstrapcdn.com/twitter-bootstrap/2.3.0/css/bootstrap.min.css" rel="stylesheet" />
    <link th:href="@{/css/booking.css}" rel="stylesheet" />
    <script  src="http://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js"></script>
    <script src="http://ajax.googleapis.com/ajax/libs/jqueryui/1.9.2/jquery-ui.min.js"></script>
    <link href="http://ajax.googleapis.com/ajax/libs/jqueryui/1.9.2/themes/smoothness/jquery-ui.css" rel="stylesheet" />
</head>
<body>
<div class="container">
    <div>
        <div class="navbar" style="width: 601px;">
            <div class="navbar-inner">
                <ul class="nav">
                    <li style="width: 100px;"><a th:href="@{/users/find}"><i class="icon-user"></i>Users</a></li>
                    <li style="width: 100px;"><a th:href="@{/}"><i class="icon-eye-open"></i>Events</a></li>
                    <li style="width: 100px;"><a th:href="@{/}"><i class="icon-film"></i>Tickets</a></li>
                </ul>
            </div>
        </div>
    </div>
    

    <h2>Users</h2>

    <table class="table table-striped">
        <thead>
            <tr>
                <th style="width: 150px;">ID</th>
                <th style="width: 200px;">Name</th>
                <th style="width: 200px;">Email</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${selections}">
                <td>
                    <a href="userDetails.html"
                       th:href="@{|/users/${user.id}|}"
                       th:text="${user.id}">123</a>
                </td>
                <td th:text="${user.name}">Mary Smith</td>
                <td th:text="${user.email}">mary@email.com</td>
            </tr>
        </tbody>
    </table>
    <div class="pagination">
        <a th:href="@{/users?name={search}&pageNum={page}(search=${name}, page=${previousPage})}">&laquo;</a>
        <a href="#" class="disabled" th:text="${currentPage}">1</a>
        <a th:href="@{/users?name={search}&pageNum={page}(search=${name}, page=${nextPage})}">&raquo;</a>
    </div>
</div>

</body>

</html>
